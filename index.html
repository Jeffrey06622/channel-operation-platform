<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>酒店渠道运营决策实训平台</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <script>
      // Boot watchdog: if the app has not mounted after 12s (module failed to load), show a recovery panel.
      setTimeout(function () {
        if (window.__appBooted) return;
        document.getElementById('root').innerHTML =
          '<div style="display:flex;min-height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#64748b;text-align:center;padding:2rem">' +
          '<div><div style="font-size:1.125rem;font-weight:600;margin-bottom:0.5rem">页面加载失败</div>' +
          '<div>请检查网络连接后刷新页面重试</div>' +
          '<button onclick="location.reload()" style="margin-top:1rem;padding:0.5rem 1.5rem;background:#475569;color:white;border:none;border-radius:0.5rem;cursor:pointer">刷新页面</button>' +
          '</div></div>';
      }, 12000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
